AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  McpGoogleDrive MCP server on AWS Lambda, behind a Function URL in RESPONSE_STREAM invoke mode
  (required for MCP's Streamable HTTP transport). Starting point only — not yet deployed or
  verified against a real AWS account; see docs/deploy-aws.md before using this for real.

Resources:
  McpGoogleDriveFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 30
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
      Environment:
        Variables:
          # GoogleAuth:ClientId/ClientSecret/PickerApiKey and DriveAccess:AllowedFolderIds come
          # from here (as GoogleAuth__ClientId etc.) rather than appsettings.json — see
          # docs/deploy-aws.md.
          ASPNETCORE_ENVIRONMENT: Production
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
                - secretsmanager:CreateSecret
                - secretsmanager:DeleteSecret
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp-google-drive/*"
    Metadata:
      DockerContext: .
      Dockerfile: src/McpGoogleDrive.Host.Lambda/Dockerfile
      DockerTag: mcp-google-drive-lambda

Outputs:
  FunctionUrl:
    Description: Invoke URL for the MCP server (IAM-authenticated — see docs/deploy-aws.md for calling it).
    Value: !GetAtt McpGoogleDriveFunctionUrl.FunctionUrl
